server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Shared upstream settings, inherited by every proxied location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    # Control-plane API and its live event streams (SSE/long-poll).
    location /api/ {
        proxy_pass http://api:8000;
    }

    # Liveness/readiness passthrough so external probes hit the single entry.
    location /health {
        proxy_pass http://api:8000;
    }

    # API documentation reachable from the same unified URL as the console.
    location /docs {
        proxy_pass http://api:8000;
    }

    location /redoc {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }

    # Single-page app fallback.
    location / {
        try_files $uri /index.html;
    }
}
