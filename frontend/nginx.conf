# Same-origin hosting for the delivery console (batch S-2).
# Static bundle at /, everything the API owns proxied to the configured API
# container, so the browser never sees a second origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 需求文档上传（POST /api/v1/issues/parse-document）：后端上限 10 MiB，
    # nginx 默认 client_max_body_size 只有 1 MiB，必须放宽到含 multipart 开销。
    client_max_body_size 12m;

    # The console routes on the hash fragment, but a reload of any path should
    # still land on the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Session cookies (repomesh_session) and SSE-style responses both need
        # the upstream answer passed through untouched.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Handy for humans and for the readiness check in the launcher scripts.
    location = /docs {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000;
        proxy_set_header Host $host;
    }
}
