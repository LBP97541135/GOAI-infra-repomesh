# Same-origin hosting for the delivery console (batch S-2).
# Static bundle at /, everything the API owns proxied to the configured API
# container, so the browser never sees a second origin.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console routes on the hash fragment, but a reload of any path should
    # still land on the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 引用的是带哈希的 bundle，本体必须每次回源校验——否则浏览器
    # 用启发式缓存拿着旧 html，新部署「看起来没生效」。带哈希的 assets 不受影响。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 需求文档上传（/issues/parse-document）走这里：nginx 默认 1MB 会把
        # 带图版式的 docx 直接 413 掉，根本到不了后端的截断逻辑。放到 25m，
        # 真正的超限由后端 intake 上限与 parse 的 truncated 标记负责。
        client_max_body_size 25m;
        # Session cookies (repomesh_session) and SSE-style responses both need
        # the upstream answer passed through untouched.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Handy for humans and for the readiness check in the launcher scripts.
    location = /docs {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000/docs;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /health/ {
        proxy_pass http://__REPOMESH_API_UPSTREAM__:8000;
        proxy_set_header Host $host;
    }
}
