    <text x="268" y="516" font-size="11" fill="#6b6046">The name is an AgentTeams resource name, not a person's. “Status” is the enabled state held in agent_directory — it is not</text>
    <text x="268" y="532" font-size="11" fill="#6b6046">an observed awake/asleep state, and the uptime column says so rather than showing a number: the controller's response</text>
    <text x="268" y="548" font-size="11" fill="#6b6046">carries no timestamp at all. Filling either in would be an invention; deleting the column would hide the gap.</text>
    <text class="mono" x="1128" y="572" font-size="10" fill="#6b6046" text-anchor="end">Illustrative · the console ships in Chinese; labels translated here</text>
