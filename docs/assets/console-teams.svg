    <text x="268" y="558" font-size="11" fill="#6b6046">“Team ready” comes from the persisted topology — the historical fact that this team was built. “Runtime” is what the</text>
    <text x="268" y="574" font-size="11" fill="#6b6046">AgentTeams controller observes right now. They are different facts, so they get two badges: merging them would print</text>
    <text x="268" y="590" font-size="11" fill="#6b6046">“team failed” for a team that was built and whose rooms still exist, the moment the controller goes quiet.</text>
