<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 552" width="1160" height="552" role="img" aria-labelledby="t d">
  <title id="t">The RepoMesh repository grid</title>
  <desc id="d">One card per repository in the catalog, carrying its resident team count, its open issues and active tasks, and a chip per team stationed on it.</desc>

  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    .mono { font-family: Consolas, "SF Mono", Menlo, monospace; }
  </style>

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="win"><rect x="1" y="1" width="1158" height="550" rx="2"/></clipPath>

    <g id="ic-issues" fill="none" stroke-width="1.3">
