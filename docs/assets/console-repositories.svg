    <text x="268" y="474" font-size="11" fill="#6b6046">Teams are formed per issue × repository (rm-team-*, a teamRoom plus a leaderDM); a standing team can also be provisioned</text>
    <text x="268" y="490" font-size="11" fill="#6b6046">up front, and both paths reuse the same people — a repository's leader is a singleton in the directory. The discovery</text>
    <text x="268" y="506" font-size="11" fill="#6b6046">evidence held per repository (auto_card) is not projected by this endpoint yet.  live · GET /console/repositories</text>
