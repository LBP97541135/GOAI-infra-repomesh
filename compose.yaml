services:
  postgres:
    # Profiled so that `--profile console` does not drag this database (and its
    # published 5432) into the self-contained console stack below. Naming the
    # service explicitly still starts it without any flag - `docker compose up -d
    # postgres` enables the profile of a service it is told to start - and the
    # platform api keeps it as a dependency under the platform profile.
    profiles: ["dev", "platform"]
    image: postgres:17-alpine
    # Every service here carries restart: unless-stopped because a Docker
    # engine restart otherwise leaves the whole dependency chain down with
    # nothing to pull it back up — and depends_on/service_healthy only gates
    # the `docker compose up` that created a container: a dependent stuck in
    # Created never starts on its own, so after an engine crash re-run
    # `docker compose --profile <profile> up -d` rather than waiting.
    restart: unless-stopped
    environment:
      POSTGRES_DB: repomesh
      POSTGRES_USER: repomesh
      POSTGRES_PASSWORD: repomesh
    ports:
      # Host port only; the container always listens on 5432. Override when the
      # host's 5432 is already taken: REPOMESH_POSTGRES_PORT=5433 docker compose ...
      # scripts/dev-up.* reads the same variable to build its DSN.
      - "${REPOMESH_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomesh -d repomesh"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - repomesh-postgres:/var/lib/postgresql/data

  api:
    profiles: ["platform"]
    build:
      context: .
    # Lets the credentials save-and-restart flow (PUT /api/v1/setup/credentials/*)
    # exit the process to pick up newly saved DB config; Docker brings it back.
    restart: unless-stopped
    environment:
      REPOMESH_ENVIRONMENT: development
      REPOMESH_LOG_LEVEL: INFO
      REPOMESH_SUPERVISED: "true"
      REPOMESH_DATABASE_URL: postgresql+asyncpg://repomesh:repomesh@postgres:5432/repomesh
      REPOMESH_LOCAL_SESSION_TTL_SECONDS: ${REPOMESH_LOCAL_SESSION_TTL_SECONDS:-28800}
      REPOMESH_MODEL_API_KEY: ${REPOMESH_MODEL_API_KEY:-}
      REPOMESH_MODEL_BASE_URL: ${REPOMESH_MODEL_BASE_URL:-https://www.vibeapi.cn/v1}
      REPOMESH_MODEL: ${REPOMESH_MODEL:-gpt-5.4-mini}
      REPOMESH_DEEPSEEK_API_KEY: ${REPOMESH_DEEPSEEK_API_KEY:-${REPOMESH_MODEL_API_KEY:-}}
      REPOMESH_DEEPSEEK_BASE_URL: ${REPOMESH_DEEPSEEK_BASE_URL:-${REPOMESH_MODEL_BASE_URL:-https://www.vibeapi.cn/v1}}
      REPOMESH_DEEPSEEK_MODEL: ${REPOMESH_DEEPSEEK_MODEL:-${REPOMESH_MODEL:-gpt-5.4-mini}}
      # LLM 聊天读超时（默认 120s）：推理型模型/慢供应商需要更长窗口，从 .env 透传。
      REPOMESH_LLM_TIMEOUT_SECONDS: ${REPOMESH_LLM_TIMEOUT_SECONDS:-120}
      # Worker 执行预约的租约回收协调器：worker 掉线/取消会留下孤儿 preparing 预约，
      # 不开它就永远没人回收（任务假 running、房间报错循环）。默认 False 是历史原因。
      REPOMESH_WORKER_RECOVERY_ENABLED: ${REPOMESH_WORKER_RECOVERY_ENABLED:-true}
      # 容器内 git（clone/fetch）走宿主机代理：绕过对 github git 协议的限速。
      # host.docker.internal 由 Docker Desktop 转发到宿主回环上的代理端口。
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: http.https://github.com/.proxy
      GIT_CONFIG_VALUE_0: http://host.docker.internal:10808
      # L3 semantic retrieval（decision-chain RAG）：从宿主机 .env 透传。
      # 留空 = 后端如实 503/structural 回退，语义检索不可用。
      REPOMESH_EMBEDDING_BASE_URL: ${REPOMESH_EMBEDDING_BASE_URL:-}
      REPOMESH_EMBEDDING_API_KEY: ${REPOMESH_EMBEDDING_API_KEY:-}
      REPOMESH_EMBEDDING_MODEL: ${REPOMESH_EMBEDDING_MODEL:-text-embedding-3-small}
      REPOMESH_EMBEDDING_TIMEOUT_SECONDS: ${REPOMESH_EMBEDDING_TIMEOUT_SECONDS:-30}
      # AgentLoop（阿里云 ARMS）遥测上报：从宿主机 .env 透传。此前容器编排没映射
      # 这组变量，容器化部署的上报实际恒关（只有宿主机直跑带 .env 才生效）；
      # 留空 = setup_tracing(None) 如实关闭，不影响启动。观测门户的 AgentLoop
      # 跳转地址也从同一组配置推导。
      REPOMESH_OTLP_ENDPOINT: ${REPOMESH_OTLP_ENDPOINT:-}
      REPOMESH_OTLP_SERVICE_NAME: ${REPOMESH_OTLP_SERVICE_NAME:-repomesh-api}
      REPOMESH_OTLP_HEADERS: ${REPOMESH_OTLP_HEADERS:-}
      REPOMESH_OTLP_METRICS_ENABLED: ${REPOMESH_OTLP_METRICS_ENABLED:-false}
      REPOMESH_OTLP_LOGS_ENABLED: ${REPOMESH_OTLP_LOGS_ENABLED:-false}
      REPOMESH_OTLP_LOG_LEVEL: ${REPOMESH_OTLP_LOG_LEVEL:-WARNING}
      REPOMESH_AGENTLOOP_CONSOLE_URL: ${REPOMESH_AGENTLOOP_CONSOLE_URL:-}
      REPOMESH_RUNNER_CONTROL_TOKEN: ${REPOMESH_RUNNER_CONTROL_TOKEN:-}
      REPOMESH_AGENT_ACTION_TOKEN: ${REPOMESH_AGENT_ACTION_TOKEN:-}
      # 非空才会让 principal_registration.with_task_control 把 repomesh-task-control
      # 这个 MCP server 投影进 worker CRD，控制器据此为 worker 生成 config/mcporter.json；
      # 留空则 worker 没有该工具、无法调用 start_assigned_task 消费任务包（会 BLOCKED）。
      # 指向平台 api 服务在 agentteams-net 上的别名（worker 侧已验证 api:8000 可达）。
      REPOMESH_WORKER_TASK_CONTROL_URL: ${REPOMESH_WORKER_TASK_CONTROL_URL:-http://api:8000/api/v1/mcp/worker}
      REPOMESH_MCP_GATEWAY_TOKEN: ${REPOMESH_MCP_GATEWAY_TOKEN:-}
      REPOMESH_MCP_GATEWAY_TOKENS: ${REPOMESH_MCP_GATEWAY_TOKENS:-[]}
      # 开发免鉴权直连 worker MCP。端点自身在 environment 非 development/test 时仍返回
      # 503（见 worker_mcp._authorize），故默认 true 只在本 dev 编排生效、自带护栏。
      REPOMESH_DIRECT_WORKER_MCP_ENABLED: ${REPOMESH_DIRECT_WORKER_MCP_ENABLED:-true}
      REPOMESH_GITHUB_APP_ID: ${REPOMESH_GITHUB_APP_ID:-0}
      # No secret file is mounted here; container deployments use base64.
      REPOMESH_GITHUB_APP_PRIVATE_KEY_BASE64: ${REPOMESH_GITHUB_APP_PRIVATE_KEY_BASE64:-}
      REPOMESH_GITHUB_WEBHOOK_SECRET: ${REPOMESH_GITHUB_WEBHOOK_SECRET:-}
      REPOMESH_DELIVERY_AUTO_ENABLED: ${REPOMESH_DELIVERY_AUTO_ENABLED:-false}
      REPOMESH_DELIVERY_BASE_BRANCH: ${REPOMESH_DELIVERY_BASE_BRANCH:-main}
      REPOMESH_DELIVERY_REQUIRED_CHECKS: ${REPOMESH_DELIVERY_REQUIRED_CHECKS:-[]}
      REPOMESH_DELIVERY_REQUIRED_APPROVALS: ${REPOMESH_DELIVERY_REQUIRED_APPROVALS:-1}
      REPOMESH_DELIVERY_RECONCILE_INTERVAL_SECONDS: ${REPOMESH_DELIVERY_RECONCILE_INTERVAL_SECONDS:-60}
      REPOMESH_SCM_OBSERVATION_REPLAY_INTERVAL_SECONDS: ${REPOMESH_SCM_OBSERVATION_REPLAY_INTERVAL_SECONDS:-15}
      REPOMESH_SCM_POLL_INTERVAL_SECONDS: ${REPOMESH_SCM_POLL_INTERVAL_SECONDS:-60}
      REPOMESH_SCM_POLL_SCAN_INTERVAL_SECONDS: ${REPOMESH_SCM_POLL_SCAN_INTERVAL_SECONDS:-15}
      REPOMESH_SCM_COMMAND_DISPATCH_INTERVAL_SECONDS: ${REPOMESH_SCM_COMMAND_DISPATCH_INTERVAL_SECONDS:-5}
      REPOMESH_RUNNER_WORKSPACE_ROOT: /runner-workspaces
      # start_assigned_task 未显式给 adapter 时的回退。本地一键栈的 Runner 镜像
      # 只装了校验用 mock 编码代理（repomesh-mock-agent），所以默认 mock；接入
      # 真实 CLI 的部署把它改成该 CLI 在 runner profile 目录里的 id。
      # 真实编码代理：runner 容器内的 codex CLI（app-server 模式）。
      # 依赖两个绑定：宿主的 codex Linux 二进制 + ~/.codex 凭据目录。
      REPOMESH_WORKER_DEFAULT_ADAPTER_ID: ${REPOMESH_WORKER_DEFAULT_ADAPTER_ID:-codex}
      # 告警触达风险边界时的自动姿态：none 只告警不动手；degrade_writes /
      # pause_intake 会让 OperationalGate 真正咬合（如 pause_intake 拒绝新建
      # issue）。部署自己声明愿意让告警联动多深，默认只观测不干预。
      REPOMESH_OPERATIONS_ALERT_ACTION: ${REPOMESH_OPERATIONS_ALERT_ACTION:-none}
      # STORAGE_ROOT 只服务 LocalTraceSource：从共享卷里直接读 MinIO 桶目录做可观测
      # 性 trace 采集（api 与 controller/MinIO 共享 agentteams-data 卷）。它不是任务包
      # 的投递路径——Worker 走 S3（mc mirror agentteams/<桶>/teams/.../shared/tasks/...）
      # 取包，而 MinIO 的 S3 API 不会把裸写进后端目录的文件当对象返回。所以任务包必须由
      # API 通过下面的 STORAGE_ENDPOINT/ACCESS_KEY/SECRET_KEY 走 S3 对象发布器写入；三者
      # 都配齐时 bootstrap 才选 AgentTeamsObjectTaskPublisher，否则回退到磁盘发布器、
      # Worker 的 mirror 什么也读不到。桶名两处共用，必须与 AgentTeams 实际注册的桶一致
      # （本环境是 agentteams-storage，mc ls 只列出它）。
      REPOMESH_AGENTTEAMS_STORAGE_ROOT: /agentteams-data/minio/${REPOMESH_AGENTTEAMS_STORAGE_BUCKET:-agentteams-storage}
      # Manager 容器镜像（§8.7.5）：controller 的镜像 fallback 不分角色，spec.image
      # 为空的 Manager 会被发给 copaw 的 *worker* 镜像，其入口要求
      # AGENTTEAMS_WORKER_NAME 而即刻退出。默认值直接内联而非留空——空串在 pydantic
      # 里是 "" 而非 None，会误触发投影端的 image 确认断言。要换镜像就覆盖此变量；
      # 要回到「控制器自选」则删除本行。
      REPOMESH_AGENTTEAMS_MANAGER_IMAGE: ${REPOMESH_AGENTTEAMS_MANAGER_IMAGE:-higress-registry.cn-hangzhou.cr.aliyuncs.com/agentteams/agentteams-manager-copaw:v1.2.0}
    ports:
      - "${REPOMESH_API_PORT:-8000}:8000"
      # Worker 侧 MCP 直连口：agentteams-net 内的 worker 用 宿主IP:8001 调
      # repomesh-task-control（compose 注释里有验证记录）。此前由一个 socat
      # 桥容器承担，但它无重启策略、被 compose 收纳清理后就永久断链——
      # 直接在 api 上多发布一个宿主端口，少一个会静默死掉的部件。
      - "8001:8000"
    volumes:
      - ${REPOMESH_SECRETS_DIR:-./.secrets}:/app/.secrets:ro
      # 工作区根目录默认落在 AgentTeams 宿主共享目录（AGENTTEAMS_HOST_SHARE_DIR，
      # embedded 安装即用户主目录）之下：控制器给每个 worker 容器挂同样的 /host-share，
      # 于是 api 视角的 /runner-workspaces/<run> 在 worker 侧恒为
      # /host-share/.repomesh-workspaces/<run>，两侧视角经 runner 的 FROM/TO 对齐。
      - ${REPOMESH_RUNNER_WORKSPACE_ROOT:-${AGENTTEAMS_HOST_SHARE_DIR:-.}/.repomesh-workspaces}:/runner-workspaces
      - agentteams-storage:/agentteams-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - agentteams
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    profiles: ["platform"]
    build:
      context: ./frontend
      args:
        API_UPSTREAM: api
    restart: unless-stopped
    environment:
      REPOMESH_BROWSER_API_TOKEN: ${REPOMESH_AGENT_ACTION_TOKEN:-}
      REPOMESH_BROWSER_API_TOKEN_FILE: /run/repomesh/browser-action-token
    volumes:
      - ${REPOMESH_SECRETS_DIR:-./.secrets}/browser-action-token:/run/repomesh/browser-action-token:ro
    ports:
      - "${REPOMESH_WEB_PORT:-5280}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------------ runner
  # The execution plane: long-polls a leased RunnerTask from the api and posts
  # ordered RunnerEvents back (contracts/runtime/v1). The image ships the
  # validation mock coding agent (profile `mock`) — no model, no credentials —
  # so the local stack exercises the whole task path; mount a real CLI and set
  # REPOMESH_WORKER_DEFAULT_ADAPTER_ID on the api to use one.
  #
  # The api prepares each workspace under /runner-workspaces and the task
  # carries that path; the runner remaps it into the shared /host-share view
  # (WORKSPACE_PATH_FROM/TO) — the same path AgentTeams worker containers see,
  # because the controller binds the host share directory into every worker at
  # /host-share. The worktree's .git pointer is written relative
  # (git_worktree._make_gitdir_portable) so one tree serves every container.
  runner:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: components/repomesh-runner/Dockerfile
    restart: unless-stopped
    environment:
      REPOMESH_RUNNER_TASK_SOURCE_URL: http://api:8000/api/v1/runtime/runner-tasks/next
      REPOMESH_RUNNER_EVENT_SINK_URL: http://api:8000/api/v1/runtime/runner-events
      REPOMESH_RUNNER_CONTROL_TOKEN: ${REPOMESH_RUNNER_CONTROL_TOKEN:-}
      # /host-share/.repomesh-workspaces is the worker-container view of the
      # same host directory the api mounts at /runner-workspaces; keeping the
      # runner's own view identical to the worker's means every path the
      # runner logs, reports or hands downstream is already valid where the
      # worker runs. The image bakes WORKSPACE_ROOT=/workspace, so an explicit
      # override is required — build_default_executor resolves worktrees
      # against it.
      REPOMESH_RUNNER_WORKSPACE_PATH_FROM: /runner-workspaces
      REPOMESH_RUNNER_WORKSPACE_PATH_TO: /host-share/.repomesh-workspaces
      REPOMESH_RUNNER_WORKSPACE_ROOT: /host-share/.repomesh-workspaces
    volumes:
      - ${REPOMESH_RUNNER_WORKSPACE_ROOT:-${AGENTTEAMS_HOST_SHARE_DIR:-.}/.repomesh-workspaces}:/host-share/.repomesh-workspaces
      # 真实编码代理：宿主的 codex Linux 二进制 + 凭据目录挂进 runner
      - ${REPOMESH_CODEX_BIN_HOST_PATH:-./.repomesh-workspaces/bin/codex}:/usr/local/bin/codex:ro
      - ${REPOMESH_CODEX_HOME:-C:\Users\PC\.codex}:/home/runner/.codex
    depends_on:
      api:
        condition: service_healthy

  bootstrap:
    profiles: ["platform"]
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    restart: unless-stopped
    environment:
      REPOMESH_ENVIRONMENT: development
      REPOMESH_LOG_LEVEL: INFO
      REPOMESH_DATABASE_URL: postgresql+asyncpg://repomesh:repomesh@postgres:5432/repomesh
      REPOMESH_BOOTSTRAP_MODE: ${REPOMESH_BOOTSTRAP_MODE:-production}
      REPOMESH_BOOTSTRAP_POLL_SECONDS: ${REPOMESH_BOOTSTRAP_POLL_SECONDS:-2}
      REPOMESH_BOOTSTRAP_LEASE_SECONDS: ${REPOMESH_BOOTSTRAP_LEASE_SECONDS:-300}
      REPOMESH_CREDENTIALS_ENCRYPTION_KEY_FILE: /app/.secrets/platform-credentials.key
      AGENTTEAMS_ENV_FILE: /app/.secrets/agentteams-manager.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${REPOMESH_SECRETS_DIR:-./.secrets}:/app/.secrets
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/repomesh-bootstrap-ready"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------------ console
  # `docker compose --profile console up -d` brings up the delivery console on
  # its own: database, API (which migrates itself on start), and the built
  # frontend served from the same origin by nginx. The host needs Docker only.
  #
  # This stack is deliberately separate from the `postgres` / `api` services
  # above: it owns its own database volume, publishes exactly one host port,
  # and is mutually exclusive with scripts/dev-up.* (both use 8100).
  console-postgres:
    profiles: ["console"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: repomesh
      POSTGRES_USER: repomesh
      POSTGRES_PASSWORD: repomesh
    # No host port on purpose: nothing outside the stack talks to this database,
    # and the platform postgres above already claims 5432 on the host. To poke
    # at it: docker compose --profile console exec console-postgres psql -U repomesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repomesh -d repomesh"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - repomesh-console-postgres:/var/lib/postgresql/data

  console-api:
    profiles: ["console"]
    build:
      context: .
    # Same as api: the credentials save-and-restart flow relies on Docker
    # restarting this container after it exits to pick up new DB config.
    restart: unless-stopped
    volumes:
      - ./.secrets:/app/.secrets
    environment:
      REPOMESH_ENVIRONMENT: development
      REPOMESH_LOG_LEVEL: INFO
      REPOMESH_SUPERVISED: "true"
      REPOMESH_DATABASE_URL: postgresql+asyncpg://repomesh:repomesh@console-postgres:5432/repomesh
      # Same default as frontend/.env.development; the web image is built with
      # the matching token, so overriding this means overriding it for both.
      REPOMESH_AGENT_ACTION_TOKEN: ${REPOMESH_CONSOLE_ACTION_TOKEN:-console-dev-token}
      REPOMESH_LOCAL_SESSION_TTL_SECONDS: ${REPOMESH_LOCAL_SESSION_TTL_SECONDS:-28800}
      # Repository scanning: SSRF allowlist plus credentials for private repos.
      # github.com / *.github.com / gitlab.com / any host containing "gitlab"
      # scan by default; this allowlist only gates custom self-hosted domains
      # the platform detection cannot name.
      REPOMESH_REPOSITORY_SCAN_ALLOWED_HOSTS: ${REPOMESH_REPOSITORY_SCAN_ALLOWED_HOSTS:-github.com}
      REPOMESH_REPOSITORY_SCAN_GITHUB_TOKEN: ${REPOMESH_REPOSITORY_SCAN_GITHUB_TOKEN:-}
      REPOMESH_REPOSITORY_SCAN_GITLAB_TOKEN: ${REPOMESH_REPOSITORY_SCAN_GITLAB_TOKEN:-}
    # The image CMD is `alembic upgrade head && uvicorn ...`, so the container
    # migrates its own (private) database on every start.
    depends_on:
      console-postgres:
        condition: service_healthy
    healthcheck:
      # /docs, not /health/ready: readiness reports 503 under this minimal
      # configuration, which says nothing about the API being able to serve.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')",
        ]
      interval: 5s
      timeout: 3s
      retries: 24

  console-web:
    profiles: ["console"]
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        API_UPSTREAM: console-api
    environment:
      REPOMESH_BROWSER_API_TOKEN: ${REPOMESH_CONSOLE_ACTION_TOKEN:-console-dev-token}
    # The only published port of the console stack: nginx serves the built SPA
    # and reverse-proxies /api to console-api, so the browser sees one origin
    # and no CORS or dev proxy is involved.
    ports:
      - "${REPOMESH_CONSOLE_PORT:-8100}:80"
    depends_on:
      console-api:
        condition: service_healthy

volumes:
  repomesh-postgres:
  repomesh-console-postgres:
  agentteams-storage:
    external: true
    name: agentteams-data

networks:
  agentteams:
    external: true
    name: agentteams-net

