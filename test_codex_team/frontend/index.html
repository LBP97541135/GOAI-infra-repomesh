<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A small accessible Todo List client." />
    <title>Todo List</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-labelledby="page-title">
      <header class="page-header">
        <p class="eyebrow">RepoMesh sample</p>
        <h1 id="page-title">Todo List</h1>
        <p class="intro">Keep the next useful thing in sight.</p>
      </header>

      <section class="todo-card" aria-label="Todo manager" aria-busy="true" id="todo-app">
        <form id="todo-form" class="todo-form">
          <label for="todo-title">New todo</label>
          <div class="form-row">
            <input
              id="todo-title"
              name="title"
              type="text"
              autocomplete="off"
              placeholder="What needs doing?"
              required
            />
            <button id="add-button" type="submit">Add todo</button>
          </div>
          <p id="title-help" class="field-help">Enter a title with at least one non-space character.</p>
        </form>

        <div id="loading-state" class="state-panel" role="status" aria-live="polite">
          Loading todos…
        </div>

        <div id="error-state" class="error-panel" role="alert" hidden>
          <p id="error-message"></p>
          <button id="retry-button" class="secondary-button" type="button" hidden>Retry loading</button>
        </div>

        <p id="operation-status" class="sr-only" role="status" aria-live="polite"></p>
        <p id="empty-state" class="state-panel" hidden>No todos yet. Add one above to get started.</p>
        <ul id="todo-list" class="todo-list" aria-label="Todos"></ul>
      </section>
    </main>

    <script type="module" src="./app.mjs"></script>
  </body>
</html>
